
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Celestial Oracle | 星启天机</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      /* 核心配色体系 */
      --color-deep-space: #02040a;
      --color-stellar-gold: #eab308;
      --color-nebula-purple: #4f46e5;
      --color-glass-border: rgba(255, 255, 255, 0.08);
      --color-glass-bg: rgba(10, 15, 30, 0.7);
    }
    
    html { scroll-behavior: smooth; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--color-deep-space);
      color: #f8fafc;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    h1, h2, h3, .font-cinzel { font-family: 'Cinzel', serif; }

    /* 高级颗粒纹理 */
    .grain {
      position: fixed;
      inset: -150%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 50;
    }

    /* 极致玻璃拟态 */
    .glass {
      background: var(--color-glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--color-glass-border);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .glass-gold {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.08), rgba(234, 179, 8, 0.02));
      border: 1px solid rgba(234, 179, 8, 0.2);
    }

    /* 安全区域适配 */
    .pb-safe { padding-bottom: calc(1rem + var(--sab)); }
    .pt-safe { padding-top: calc(1rem + var(--sat)); }

    /* 文字光效 */
    .text-glow-gold {
      text-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
    }
    
    .text-glow-white {
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* 测测风格的滚动条 */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--color-deep-space); }
    ::-webkit-scrollbar-thumb { background: rgba(234, 179, 8, 0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(234, 179, 8, 0.4); }

    @keyframes slow-pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.05); }
    }
    .animate-slow-pulse { animation: slow-pulse 8s ease-in-out infinite; }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
</head>
<body>
  <div class="grain"></div>
  <div id="root"></div>
</body>
</html>
